<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Responsive Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="top">
        <h1>Khám Phá Thiên Nhiên</h1>
        <p>Bộ sưu tập các điểm đến nổi bật với giao diện đáp ứng đa thiết bị và hỗ trợ chế độ tối.</p>
    </header>

    <main>
        <div class="grid">
            <figure>
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80" alt="Bãi biển cát trắng và nước xanh trong vắt">
                <figcaption>Bãi Biển Nhiệt Đới</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600&q=80" alt="Đỉnh núi phủ tuyết dưới bầu trời đầy sao">
                <figcaption>Đỉnh Núi Tuyết Đêm</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&q=80" alt="Rừng cây xanh mướt phủ sương mù buổi sáng">
                <figcaption>Rừng Sương Mù</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&q=80" alt="Ánh nắng xuyên qua tán lá rừng rậm">
                <figcaption>Nắng Xuyên Rừng Già</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=600&q=80" alt="Thung lũng cỏ xanh rộng lớn lúc hoàng hôn">
                <figcaption>Thung Lũng Hoàng Hôn</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600&q=80" alt="Con đường mòn dẫn lên đỉnh đồi nhìn ra thung lũng">
                <figcaption>Đường Mòn Trên Đỉnh Đồi</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=600&q=80" alt="Hồ nước phẳng lặng phản chiếu vách núi đá">
                <figcaption>Hồ Nước Phản Chiếu</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=600&q=80" alt="Thác nước trắng xóa đổ xuống giữa rừng cây">
                <figcaption>Thác Nước Giữa Rừng</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=600&q=80" alt="Toàn cảnh dãy núi trùng điệp từ trên cao">
                <figcaption>Dãy Núi Trùng Điệp</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p><a href="#top">Quay lại đầu trang</a></p>
    </footer>
</body>
</html>
